<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scraping to KPI lab</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  #kpi-card { padding: 1rem; border: 2px solid #0d7c9e; border-radius: 8px; }
  #kpi-card .value { font-size: 2rem; font-weight: bold; color: #0d7c9e; }
  #kpi-card .label { font-size: 0.9rem; color: #666; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }
  .kpi-box {
    padding: 1rem;
    border: 1px solid #cfe8f2;
    border-radius: 8px;
    background: #f8fbfc;
  }
  canvas { margin-top: 1.5rem; }
  #updated { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>Scraping to KPI lab</h1>
  <p>Two KPI views computed from LLM-extracted skills across real scraped postings — see <code>data/extracted.json</code> and <code>compute_kpi.py</code>.</p>
  <div id="kpi-card">Loading...</div>
  <canvas id="skillsChart" height="320"></canvas>
  <p id="updated"></p>

<script>
fetch('data/kpi.json')
  .then(r => r.json())
  .then(data => {
    const stage4 = data.stage_4_kpi || data;
    const cloud = data.cloud_provider_kpi || null;

    if (!stage4 || !stage4.n_postings_analyzed) {
      document.getElementById('kpi-card').innerHTML = '<p>No KPI computed yet -- run extract_skills.py then compute_kpi.py.</p>';
      return;
    }

    document.getElementById('kpi-card').innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-box">
          <div class="value">${(stage4.kpi_value * 100).toFixed(0)}%</div>
          <div class="label">${stage4.kpi_label} (${stage4.n_matching} of ${stage4.n_postings_analyzed} postings)</div>
          <div class="label">Average ${stage4.avg_skills_per_posting} distinct skills extracted per posting</div>
        </div>
        <div class="kpi-box">
          <div class="value">${cloud ? (cloud.kpi_value * 100).toFixed(0) + '%' : 'N/A'}</div>
          <div class="label">${cloud ? cloud.kpi_label : 'Cloud provider KPI unavailable'} ${cloud ? `(${cloud.n_matching} of ${cloud.n_postings_analyzed} postings)` : ''}</div>
          <div class="label">${cloud ? 'Cloud providers seen: ' + cloud.providers_seen.map(p => p.provider.toUpperCase()).join(', ') : ''}</div>
        </div>
      </div>
    `;

    const top = stage4.top_skills || [];
    new Chart(document.getElementById('skillsChart'), {
      type: 'bar',
      data: {
        labels: top.map(s => s.skill),
        datasets: [{ label: 'Postings mentioning this skill', data: top.map(s => s.count), backgroundColor: '#0d7c9e' }],
      },
      options: {
        indexAxis: 'y',
        plugins: {
          legend: { display: false },
          title: { display: true, text: 'Most-mentioned skills across analyzed postings' },
        },
      },
    });

    document.getElementById('updated').textContent = `Data last computed ${stage4.generated_at || '(see script output)'}`;
  })
  .catch(err => {
    document.getElementById('kpi-card').innerHTML = '<p>Could not load KPI (' + err + ').</p>';
  });
</script>
</body>
</html>
